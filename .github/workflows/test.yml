name: Test

on:
  push:
    branches: [main, v3]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Contract kit matches its MANIFEST
        run: ./gradlew checkConformance
      - name: Translated READMEs match README.md
        run: python3 scripts/build_readmes.py --check
      - name: Build, unit and conformance tests, examples (no network, no keys)
        run: ./gradlew build
        env:
          FINLIGHT_API_KEY: ""
      - name: Published jars carry no kit, fixtures or local files
        run: ./gradlew checkPackage

  lowest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests with the lowest supported Jackson
        run: ./gradlew test -PjacksonVersion=2.13.5

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid license for organization
      # repositories; the CLI does not. .gitleaks.toml allowlists the
      # synthetic keys of the contract kit and the tests.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
      - name: No AI attribution in commit messages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Commits up to e754f19 predate this check.
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=e754f19
          fi
          if git log --format=%B "$base..HEAD" | grep -inE 'co-authored-by|generated (with|by)|claude|chatgpt|copilot'; then
            echo "commit messages must not carry AI attribution" >&2
            exit 1
          fi

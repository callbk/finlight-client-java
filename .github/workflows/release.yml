name: Release

# Publishes the tagged version to Maven Central (Central Portal), only from CI and a clean checkout.
# Repository secrets (publish is skipped while they are missing):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  - Central Portal token
#   SIGNING_KEY / SIGNING_PASSWORD                   - ASCII-armored PGP key

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: The tag matches the version (one source of truth)
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version=${VERSION} in gradle.properties" >&2
            exit 1
          fi
      - name: Build and test from an empty output directory
        run: ./gradlew clean build checkPackage
      - name: Publish to Maven Central
        if: env.MAVEN_CENTRAL_USERNAME != ''
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache
      - name: Publish skipped
        if: env.MAVEN_CENTRAL_USERNAME == ''
        run: echo "MAVEN_CENTRAL_USERNAME secret not set - skipping Maven Central publish."
      - name: GitHub release with the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
